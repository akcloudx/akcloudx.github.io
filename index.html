<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aakif Shaikh — Cloud Solutions Architect</title>
  <meta name="description" content="Cloud consultant and architect specialising in multi-cloud cost optimisation, FinOps and security design." />
  <meta name="theme-color" content="#05070d" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aakif Shaikh — Cloud Solutions Architect" />
  <meta property="og:description" content="Multi-cloud architecture, FinOps and security design." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2305070d'/%3E%3Ctext x='50' y='50' font-family='Helvetica,Arial' font-size='44' font-weight='700' fill='%2352d5ff' text-anchor='middle' dominant-baseline='central'%3EAS%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="stylesheet" href="src/css/layout.css" />
  <link rel="stylesheet" href="src/css/sections.css" />

</head>
<body>

  <!-- ══════════════════════════════════════════════════ preloader ══════ -->
  <div class="preloader" id="preloader">
    <div class="preloader__inner">
      <div class="preloader__name" id="preloaderName"></div>
      <div class="preloader__meta">
        <span class="preloader__status" id="preloaderStatus">initialising</span>
        <span class="preloader__count" id="preloaderCount">0</span>
      </div>
      <div class="preloader__bar"><i id="preloaderBar"></i></div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════ background fx ══════ -->
  <canvas class="fx-canvas" id="fxCanvas" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <!-- ═════════════════════════════════════════════════ custom cursor ════ -->
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"><span class="cursor__label" id="cursorLabel"></span></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════ header ═════ -->
  <header class="header" id="header">
    <a class="header__mark" href="#top" data-cursor="home">
      <span class="header__mark-glyph" id="headerMark"></span>
      <span class="header__mark-name" id="headerName"></span>
    </a>
    <nav class="header__nav" id="headerNav" aria-label="Primary"></nav>
    <button class="header__toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <div class="menu" id="menu" aria-hidden="true">
    <nav class="menu__nav" id="menuNav" aria-label="Mobile"></nav>
    <div class="menu__foot" id="menuFoot"></div>
  </div>

  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

  <!-- ═════════════════════════════════════════════════════════ main ═════ -->
  <main id="top">

    <!-- ───────────────────────────────────────────────────── hero ─────── -->
    <section class="hero" id="hero">

      <div class="hero__content">
        <h1 class="hero__name" id="heroName" aria-label="Aakif Shaikh"></h1>

        <div class="hero__role">
          <span class="hero__role-static" id="heroTitle"></span>
          <span class="hero__role-rotator" id="heroRotator" aria-live="polite"></span>
        </div>

        <p class="hero__tagline" id="heroTagline" data-reveal></p>

        <div class="hero__actions" data-reveal>
          <a class="btn btn--primary" href="#work" data-magnetic data-cursor="explore">
            <span>Explore my work</span>
          </a>
          <a class="btn btn--ghost" href="#contact" data-magnetic data-cursor="say hi">
            <span>Get in touch</span>
          </a>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true">
        <span>Scroll</span>
        <i></i>
      </div>

    </section>

    <!-- ──────────────────────────────────────────────────── ticker ────── -->
    <div class="ticker" aria-hidden="true">
      <div class="ticker__track" id="tickerTrack"></div>
    </div>

    <!-- ───────────────────────────────────────────────────── about ────── -->
    <section class="section section--about" id="about">
      <div class="shell">
        <div class="section__head">
          <span class="section__label" data-reveal id="aboutLabel"></span>
          <h2 class="section__title" data-split id="aboutHeading"></h2>
        </div>

        <div class="about">
          <p class="about__lead" data-split id="aboutLead"></p>
          <div class="about__body" id="aboutBody"></div>
        </div>

        <div class="metrics" id="metrics"></div>
      </div>
    </section>

    <!-- ────────────────────────────────────────────────────── work ────── -->
    <section class="section section--work" id="work">
      <div class="shell work__top">
        <div class="section__head">
          <span class="section__label" data-reveal id="workLabel"></span>
          <h2 class="section__title" data-split id="workHeading"></h2>
        </div>

        <div class="work__controls">
          <p class="gallery__hint">
            Drag, swipe or use the arrows &nbsp;·&nbsp;
            <span id="galleryCounter">01 / 04</span>
          </p>
          <div class="gallery__nav">
            <button class="gallery__btn" id="galleryPrev" aria-label="Previous project" data-cursor="prev">
              <span aria-hidden="true">&#8592;</span>
            </button>
            <button class="gallery__btn" id="galleryNext" aria-label="Next project" data-cursor="next">
              <span aria-hidden="true">&#8594;</span>
            </button>
          </div>
        </div>
      </div>

      <div class="gallery" id="gallery">
        <div class="gallery__track" id="galleryTrack"></div>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────── certifications ─── -->
    <section class="section section--certs" id="certs">
      <div class="shell">
        <div class="section__head">
          <span class="section__label" data-reveal id="certsLabel"></span>
          <h2 class="section__title" data-split id="certsHeading"></h2>
        </div>
        <div class="certs" id="certsGrid"></div>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────────── journey ────── -->
    <section class="section section--journey" id="journey">
      <div class="shell">
        <div class="section__head">
          <span class="section__label" data-reveal id="expLabel"></span>
          <h2 class="section__title" data-split id="expHeading"></h2>
        </div>
        <div class="timeline" id="timeline">
          <div class="timeline__spine" aria-hidden="true"><i id="timelineFill"></i></div>
          <div class="timeline__items" id="timelineItems"></div>
        </div>
      </div>
    </section>

    <!-- ───────────────────────────────────────────────── education ────── -->
    <section class="section section--education" id="education">
      <div class="shell">
        <div class="section__head">
          <span class="section__label" data-reveal id="eduLabel"></span>
          <h2 class="section__title" data-split id="eduHeading"></h2>
        </div>
        <div class="education" id="educationList"></div>
        <div class="languages" id="languages"></div>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────────── contact ────── -->
    <section class="section section--contact" id="contact">
      <div class="shell">
        <span class="section__label" data-reveal id="contactLabel"></span>
        <h2 class="contact__title" data-split id="contactHeading"></h2>
        <p class="contact__body" data-reveal id="contactBody"></p>
        <div class="contact__links" id="contactLinks"></div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <span id="footerName"></span>
      <span class="footer__time" id="footerClock"></span>
      <button class="footer__top" id="backToTop" data-magnetic data-cursor="top">Back to top</button>
    </div>
  </footer>

  <!-- UMD libraries — these set window.gsap / window.ScrollTrigger / window.Lenis
       and run before the deferred module below. -->
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>

  <script type="module" src="src/js/main.js"></script>
  <noscript>
    <style>.preloader{display:none}</style>
    <p style="padding:2rem;color:#e6e9f2">This portfolio uses JavaScript for its animation and content. Please enable it.</p>
  </noscript>
</body>
</html>
